yolo:
  _target_: src.data.CropROITransform
  yolo_path: models/yolo.torchscript
  yolo_size: 640
  target_size: 512
data_module:
  _target_: src.data.DataModule
  csv_path: data/labels.csv
  data_path: data/
  resize_size: 2000
  seed: ${seed}
  bbox_csv: "data/computed_boxes.csv"
  yolo: ${..yolo}
  n_sample: ${oc.select:model.data.n_sample, null}
  val_ratio: 0.2
  test_ratio: 0.2
  include_real: true
  val_transform:
    _target_: ${const.v2}.Compose
    transforms:
    # Will be applied to all datasets including the train set
    # Occurs after all augmentations if they exist
    - _target_: ${const.v2}.Normalize
      # Scale to [-1, 1]
      mean: [0.5, 0.5, 0.5]
      std: [0.5, 0.5, 0.5]
  # These should be overwritten by the model yamls
  rec_split: ${oc.select:model.data.rec_split, false}
  # Use value of 100 to throw an error if recursive splitting does occur, as it should not by default
  # Value can be overrriten by model yamls to enable recursive splitting if desired
  split_index: ${oc.select:model.data.split_index, 100}
  rec_ratio: ${oc.select:model.data.rec_ratio, ${.val_ratio}}
  # train_transform: ${oc.select:model.data.train_transform, null}
  train_transform:
    _target_: ${const.v2}.Compose
    transforms:
      # These augmentations will only be applied to the training set
      - ${oc.select:model.data.augmentations, ${...._empty_transform}} # default to no augmentations, but allow for multiple augmentations using Compose
      # Will be applied to all datasets including the train set
      # Occurs after all augmentations if they exist
      - ${...val_transform}

# Maybe figure out how to move this into data_module
# Have default value of None in get_sampler method and use this value if None
# This way no oversamplng on the validation and test sets
oversample: ${oc.select:model.data.oversample, false}
_empty_transform:
  _target_: torch.nn.Identity