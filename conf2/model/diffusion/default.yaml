# model
_target_: src.model.LatentDiffusionModel
vae:
  _target_: src.model.VAE
  vae:
    _target_: diffusers.AutoencoderKL.from_pretrained
    pretrained_model_name_or_path: "stabilityai/sd-vae-ft-mse"
class_embedder:
  _target_: src.model.ClassEmbedder
  num_classes: 2
  emb_dim: ${...unet.cross_attention_dim}
unet:
  _target_: diffusers.UNet2DConditionModel
  _convert_: partial
  sample_size: 64
  in_channels: 4
  out_channels: 4
  cross_attention_dim: 512
  class_embed_type: null
  layers_per_block: 2
  block_out_channels: [128, 256, 512, 512]
  down_block_types: [
    "DownBlock2D",
    "DownBlock2D",
    "CrossAttnDownBlock2D",
    "CrossAttnDownBlock2D",
  ]
  up_block_types: [
    "CrossAttnUpBlock2D",
    "CrossAttnUpBlock2D",
    "UpBlock2D",
    "UpBlock2D",
  ]

data:
  rec_split: false
  # Do not want to split the data recursively, if it does occur, using a value of 100 should throw an error
  split_index: 100
  augmentations:
    _target_: ${const.v2}.Compose
    transforms:
      - _target_: ${const.v2}.RandomHorizontalFlip
        p: 0.5
      - _target_: ${const.v2}.ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0
      - ${....val_transform}

trainer:
  _target_: src.trainer.DiffusionTrainer
  model: ${model}
  num_epochs: 100
  optimizer_fn:
    _target_: src.utils.get_optimizer
    classname: torch.optim.AdamW
    weight_decay: 0.01
    # can add parameter groups using param_groups key
    # Use ENUM for name field
  batch_size: 64
  num_workers: 4
  mixed_precision: "bf16"
  seed: ${seed}
  num_save_epochs: 5
  save_path: "models/diffusion"
  scheduler:
    _target_: diffusers.DDPMScheduler
    num_train_timesteps: 1000
    # from StableDiffusion which what the architecture is based on
    beta_start: 0.00085
    beta_end: 0.012
    beta_schedule: "scaled_linear"
    clip_sample: false
    prediction_type: "epsilon"
  precompute_latents: false
  p_label_dropout: ${inference.p_label_dropout}
  num_inference_steps: ${inference.num_inference_steps}
  guidance_scale: ${inference.guidance_scale}
  percent_steps: ${inference.percent_steps}
  use_dn: ${inference.use_dn}
  num_generate: 3 # 3 per label (including null)
  num_counterfactual: 8 # 8 per class