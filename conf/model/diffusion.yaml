vae:
  hf_id: "stabilityai/sd-vae-ft-mse"
unet:
  _target_: diffusers.UNet2DConditionModel
  sample_size: 64
  in_channels: 4
  out_channels: 4
  cross_attention_dim: 512
  class_embed_type: null
  layers_per_block: 2
  block_out_channels: [128, 256, 512, 512]
  down_block_types: [
    "DownBlock2D",
    "DownBlock2D",
    "CrossAttnDownBlock2D",
    "CrossAttnDownBlock2D",
  ]
  up_block_types: [
    "CrossAttnUpBlock2D",
    "CrossAttnUpBlock2D",
    "UpBlock2D",
    "UpBlock2D",
  ]
class_embedder:
  _target_: src.model.ClassEmbedder
  num_classes: 2
  emb_dim: ${model.unet.cross_attention_dim}