optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.01
trainer:
  _target_: src.train.Trainer
  scheduler:
    _target_: diffusers.DDPMScheduler
    num_train_timesteps: 1000
    # from StableDiffusion which what the architecture is based on
    beta_start: 0.00085
    beta_end: 0.012
    beta_schedule: "scaled_linear"
    clip_sample: false
    prediction_type: "epsilon"
  # profiler:
  #   _target_: torch.profiler.profile
  #   activities:
  #     - torch.profiler.ProfilerActivity.CPU
  #     - torch.profiler.ProfilerActivity.CUDA
  #   schedule:
  #     _target_: torch.profiler.schedule
  #     wait: 1
  #     warmup: 1
  #     active: 3
  #     repeat: 1
  #   on_trace_ready:
  #     _target_: src.utils.trace_handler
  #     _partial_: true
  #     output_dir: trace/
  #     file_prefix: trace
  #   record_shapes: true
  #   profile_memory: true
  #   with_stack: true
  num_epochs: 5
  batch_size: 16
  n_counterfactual: 4 # N per class not total number generated
  mixed_precision: "bf16"
  num_workers: 0
  p_label_dropout: 0.3
  num_inference_steps: 75
  guidance_scale: 3.0
  num_generate: 3
  save_path: "models/"
  seed: ${seed}